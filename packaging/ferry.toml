# /etc/ferry/ferry.toml — ferryd configuration (all keys optional; shown with defaults or examples).

# Where the REST API, dashboard and MCP endpoint listen. Use 0.0.0.0:7070 to allow remote
# Claude Code / dashboard access (tokens are required either way); put a TLS reverse proxy in
# front if the network is untrusted.
listen = "127.0.0.1:7070"

# SQLite database, admin token and — by default — job workspaces. MUST be on the local SSD.
data_dir = "/var/lib/ferry"
# Per-job scratch (work/ and out/) root; defaults to <data_dir>/users. Keep it on the SSD.
# scratch_root = "/ssd/ferry-scratch"

# Container runtime: "podman" (recommended, rootless), "docker", or "process" (no isolation,
# development only). For docker the daemon's account must be in the `docker` group, GPUs need
# `nvidia-ctk runtime configure --runtime=docker`, and [container] user must be set (see below).
runtime = "podman"

# Image used when a job does not name one. Pre-pull it: ferry image pull <ref>
# The tag decides which GPUs work: RTX 50-series need PyTorch >= 2.7 built against CUDA >= 12.8;
# the cuda13 builds need a recent driver and Turing (RTX 20 / T4) or newer cards — use a cuda12.6
# tag for older ones. These images keep PyTorch in the system Python, where pip wants
# --break-system-packages; images/Containerfile builds a default image with that already set.
default_image = "docker.io/pytorch/pytorch:2.15.0-cuda13.2-cudnn9-runtime"

# Restrict images to this list (exact references, or prefixes ending in '/'). Empty = any image.
allowed_images = [
  "docker.io/pytorch/",
  "docker.io/nvidia/",
  "localhost/",
]

# GPU indices the scheduler may hand out. Omit for all detected GPUs; [] for none.
# Example: 4 GPUs, keep GPU 3 free for interactive use on the host.
# managed_gpus = [0, 1, 2]

# Resources kept free for people working directly on the host.
reserve_cpus = 4
reserve_mem = "16G"

# "auto" (NVML), "none", or "fake:<n>" for development without GPUs.
gpu_provider = "auto"

log_level = "info"

# Host directories mounted into every job. Datasets on the NAS (NFS, HDD) go here read-only.
# Jobs read /data; results go to /out (SSD, archived to the NAS when the job finishes).
[[mounts]]
host = "/mnt/nas/datasets"
container = "/data"
read_only = true

# Optional: a writable NAS directory for jobs that want to write final results directly.
# [[mounts]]
# host = "/mnt/nas/results"
# container = "/results"
# read_only = false

[container]
# uid:gid of the job process inside the container.
#   rootless podman: "0:0". Container root is the daemon's `ferry` account on the host: it owns
#     what jobs write to /work and /out, and it is the uid the NAS sees — make sure the export
#     grants it read access (or use all_squash/anon uid mapping). Jobs can apt/pip install inside
#     their environment and still have no rights on the host beyond that account.
#   docker: the uid:gid of the account running ferryd (`id ferry`). With "0:0" job output would
#     belong to the real root and the daemon could not clean it up.
user = "0:0"
# Leave userns unset. "keep-id" is not needed with user = "0:0", and when podman's OCI runtime is
# runc it stops every GPU container from starting ("failed to set MOUNT_ATTR_IDMAP").
# pasta, bridge, none (no network at all), host. Unset = the runtime's own default (pasta for
# rootless podman, bridge for docker). podman >= 6 no longer supports slirp4netns.
# network = "pasta"
pids_limit = 4096
# PyTorch DataLoader workers need more than podman's 64M default.
shm_size = "8g"
# "cdi" => --device nvidia.com/gpu=N (podman + nvidia-container-toolkit CDI spec)
# "docker" => --gpus device=N
# "auto" picks by runtime.
gpu_flag_style = "auto"
extra_args = []

[retention]
# Delete SSD workspaces this many days after the job finished (only after archiving).
keep_days = 14
# Start deleting the oldest finished workspaces when scratch exceeds this size.
max_scratch = "500G"
# Copy /out and the log here (NAS) as soon as a job finishes. Workspaces whose archive copy
# failed are never deleted.
archive_dir = "/mnt/nas/ferry-results"
interval_secs = 3600

[metrics]
# netdata-style monitoring: 1 s collection; per-second data kept in memory for live charts and
# written to <data_dir>/metrics.db in three tiers (per-second pages, per-minute, per-hour), each
# point keeping min/max/sum/count so peaks survive downsampling.
enabled = true
interval_secs = 1
memory_secs = 900
tier0_days = 7      # per-second
tier1_days = 90     # per-minute
tier2_days = 730    # per-hour

[archive]
# Self-contained .7z task archives on the NAS (<archive_dir>/<user>/task-<id>-<name>-<time>.7z):
# manifest.json, README.txt, steps.jsonl, env/ (snapshot images), work/, out/, logs/, metrics/task.csv.
on_close = true        # archive a task when it is closed (then drop the per-step mirror directory)
images = "head"        # none | head | pinned | all
level = 5              # 7z compression level 0-9
seven_zip = "7z"       # pacman -S 7zip
metrics = true

[fair_share]
enabled = true
# Usage halves every 7 days when ordering queued jobs of equal priority.
half_life_secs = 604800

[cluster]
# This machine's name as a node (shown as job node_id).
node_name = "local"
# Run jobs on this machine too; false = pure control node (API, scheduler, NAS, dashboard).
local_node = true
# Shared secret compute agents present when registering (`ferryd --agent`, see
# packaging/ferry-agent.toml). Empty = no agents accepted.
node_token = ""
# An agent silent for this long is marked offline; its queued jobs wait for it.
node_timeout_secs = 30

[notify]
# Users set their own webhook / Telegram chat id (dashboard → Settings, or `ferry notify set`).
# telegram_bot_token = "123456:ABC..."     # from @BotFather; enables Telegram for everyone
# telegram_api = "https://api.telegram.org" # or a reverse proxy if Telegram is blocked
# public_url = "http://gpu1.tailnet:7070"   # dashboard links in messages

[idle]
# Jobs holding GPUs at <= util_threshold % get a warning after warn_after, and are cancelled
# cancel_after later if the GPUs stayed idle. Owners are notified both times.
# enabled = true
# util_threshold = 2.0
# warn_after = "30m"
# cancel_after = "30m"
# exempt_users = []

[backup]
# Copies ferry.db (users, tokens, jobs, tasks) to <retention.archive_dir>/_ferry-backup unless
# dir is set. Restore: stop ferryd, copy a backup over <data_dir>/ferry.db, start it again.
# enabled = true
# dir = "/mnt/nas/ferry-backup"
# interval = "24h"
# keep = 14
# include_metrics = false
