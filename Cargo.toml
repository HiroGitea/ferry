[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/client",
    "crates/daemon",
    "crates/mcp",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/HiroGitea/ferry"
rust-version = "1.88"

[workspace.dependencies]
ferry-core = { path = "crates/core" }
ferry-client = { path = "crates/client" }
ferry-daemon = { path = "crates/daemon" }
ferry-mcp = { path = "crates/mcp" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["json", "query", "tokio", "http1", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tar = "0.4"
flate2 = "1"
walkdir = "2"
dirs = "6"
tabled = "0.20"
humantime = "2"
bytesize = "2"
nvml-wrapper = "0.13"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
tempfile = "3"
dialoguer = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
